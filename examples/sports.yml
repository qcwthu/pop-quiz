  - question: "The 'Tour de France' is a famous multi-stage race in which sport?"
    choices:
      - "Running"
      - "Swimming"
      - "Cycling"
      - "Skiing"
    correct: 2
    time_limit: 15

  - question: "What is the diameter of a standard basketball hoop in inches?"
    choices:
      - "16 inches"
      - "18 inches"
      - "20 inches"
      - "22 inches"
    correct: 1
    time_limit: 20
