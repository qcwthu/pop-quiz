title: "Sports Trivia"
description: "Test your knowledge of the wide world of sports!"

questions:
  - question: "Which country won the first ever FIFA World Cup in 1930?"
    choices:
      - "Brazil"
      - "Argentina"
      - "Uruguay"
      - "Italy"
    correct: 2
    time_limit: 20

  - question: "In which sport would you perform a 'slam dunk'?"
    choices:
      - "Tennis"
      - "Basketball"
      - "Volleyball"
      - "American Football"
    correct: 1
    time_limit: 15

  - question: "How many players are on a standard soccer team on the field at one time?"
    choices:
      - "9"
      - "10"
      - "11"
      - "12"
    correct: 2
    time_limit: 15

  - question: "The sport of cricket originated in which country?"
    choices:
      - "India"
      - "Australia"
      - "South Africa"
      - "England"
