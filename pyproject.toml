[project]
name = "pop-quiz"
version = "0.1.0"
description = "A browser-based pop quiz application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "openai>=2.14.0",
    "pyyaml>=6.0",
    "qrcode[pil]>=7.4",
    "questionary>=2.0.0",
    "rich>=14.2.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[project.scripts]
pop-quiz = "pop_quiz.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pillow>=12.0.0",
    "pytest-asyncio>=1.3",
    "pytest>=9.0",
    "ruff>=0.14",
    "shiv>=1.0",
    "ty>=0.0.4",
]

[tool.ruff]
line-length = 79

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
